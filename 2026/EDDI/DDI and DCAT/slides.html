<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-Content-Type-Options" content="nosniff"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>Making Sense presentation template</title>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/reset.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/reveal.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/theme/white.min.css">
	<!-- Does not seem to exist
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/pdf.min.css">
	-->
	<!-- Theme used for syntax highlighting of code -->
	<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/plugin/highlight/monokai.min.css">
	<link rel="stylesheet" href="ms.css">
</head>

<body>
	<div class="reveal">
		<div class="logo">
			<img src="making_sense_logo_2025_simple.png" width="200px" height="200px" />
		</div>
		<div class="slides">
			<!-- External markdown: here, slides are separated by three new lines, vertical slides by two (NB: change \n to \r\n under Windows) -->
			<section data-markdown="./slides.md" data-separator="^\r?\n---\r?\n$"
				data-separator-vertical="^\r?\n--\r?\n$" data-separator-notes="^Note:" data-charset="UTF-8">
			</section>
		</div>
		<button id="pdf-export-btn">
			Export as PDF
		</button>
	</div>

	<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/reveal.js"></script>
	<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/plugin/markdown.min.js"></script>
	<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/6.0.2/plugin/notes.min.js"></script>
	<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin"></script>

	<script>
		// Plugin configuration : https://revealjs.com/plugins/
		Reveal.initialize({
			controls: true,
			progress: true,
			history: true,
			center: true,
			plugins: [RevealMarkdown, RevealNotes, RevealMermaid]
		});

		// PDF Export Button Logic
		if (!window.location.search.includes("print-pdf")) {
			document.getElementById("pdf-export-btn")?.addEventListener("click", function () {
				const pdfUrl = window.location.origin + window.location.pathname + "?print-pdf" + window.location.hash;
				window.open(pdfUrl, "_blank");
			});
		}

		// Automatically trigger print in print-pdf mode
		if (window.location.search.includes("print-pdf")) {
			window.addEventListener("load", () => {
				window.print();
			});
		}
	</script>
</body>

</html>
